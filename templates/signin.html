{% extends "base.html" %} {% block head %} {{ super() }}

<link rel="stylesheet" href="{{ url_for('static', filename='extended_beauty.css') }}"/>

{% endblock %} {% block content %}

<form method="post">
    <br>
    <div class="form-group">
        <label for="exampleInputName">Name</label>
        <input type="name" class="form-control" id="exampleInputName" name="name" aria-describedby="emailHelp" placeholder="Enter name" required>
    </div>
    <div class="form-group">
        <label for="exampleInputEmail1">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" name="email" aria-describedby="emailHelp" placeholder="Enter email" required>
    </div>
    <div class="form-group">
        <label for="exampleInputPassword1">Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" name="password" placeholder="Enter password" required>
    </div>
    <div class="form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1" name="terms" required>
        <label class="form-check-label" for="exampleCheck1">Accept Terms & Conditions</label>
    </div>
    <br>
    <button type="submit" class="btn btn-primary">Submit</button>
    </form>

{% endblock %}
